<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    #starfield {
      position: fixed;
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh;
      z-index: -2;
      background: black;
    }
    
    /* Ensure content is readable over starfield */
    .navbar, .card, footer {
      background-color: rgba(var(--bs-body-bg-rgb), 0.95);
      backdrop-filter: blur(5px);
    }
    
    .bg-body-secondary {
      background-color: rgba(var(--bs-secondary-bg-rgb), 0.95) !important;
    }
    
    .bg-body-tertiary {
      background-color: rgba(var(--bs-tertiary-bg-rgb), 0.95) !important;
    }
  </style>
</head>
<body class="min-vh-100 d-flex flex-column">
  <canvas id="starfield"></canvas>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-secondary border-bottom">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/">🧠 Neural Script Decoding</a>
      <button id="themeToggle" class="btn btn-outline-secondary btn-sm ms-auto">🌓 Toggle Theme</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card shadow p-5 text-center" style="width: 100%; max-width: 500px;">
      <h2 class="mb-4">Your file is ready</h2>
      <a href="{{ url_for('static', filename=pdf_path.split('static/')[-1]) }}" class="btn btn-success w-100" download>
        Download PDF
      </a>
      <a href="/" class="btn btn-outline-primary w-100 mt-3">Upload Another</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-body-tertiary text-center text-muted py-3 border-top">
    <small>&copy; 2025 Neural Script Decoding</small>
  </footer>

  <script>
    // Theme handling
    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
      
      // Initialize starfield after DOM is loaded
      initStarfield();
      
      // Theme toggle
      document.getElementById('themeToggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-bs-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', next);
        localStorage.setItem('theme', next);
      });
    });
    
    function initStarfield() {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      let stars = [];
      const numStars = 200;
      
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Initialize stars
        stars = [];
        for (let i = 0; i < numStars; i++) {
          stars.push({
            x: (Math.random() - 0.5) * canvas.width,
            y: (Math.random() - 0.5) * canvas.height,
            z: Math.random() * canvas.width
          });
        }
      }
      
      function animate() {
        // Clear canvas with black background
        ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw stars
        ctx.fillStyle = 'white';
        
        for (let i = 0; i < stars.length; i++) {
          const star = stars[i];
          
          // Move star towards viewer
          star.z -= 3;
          
          // Reset star if it's too close
          if (star.z <= 0) {
            star.x = (Math.random() - 0.5) * canvas.width;
            star.y = (Math.random() - 0.5) * canvas.height;
            star.z = canvas.width;
          }
          
          // Calculate screen position
          const k = 128.0 / star.z;
          const x = star.x * k + canvas.width / 2;
          const y = star.y * k + canvas.height / 2;
          
          // Skip if star is outside screen
          if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) {
            continue;
          }
          
          // Calculate star size based on distance
          const size = (1 - star.z / canvas.width) * 3;
          const opacity = 1 - star.z / canvas.width;
          
          // Draw star with trail effect
          ctx.globalAlpha = opacity;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, 2 * Math.PI);
          ctx.fill();
          
          // Draw star trail
          if (size > 1) {
            ctx.globalAlpha = opacity * 0.3;
            ctx.beginPath();
            ctx.arc(x, y, size * 2, 0, 2 * Math.PI);
            ctx.fill();
          }
        }
        
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }
      
      // Handle window resize
      window.addEventListener('resize', resizeCanvas);
      
      // Initialize
      resizeCanvas();
      animate();
    }
  </script>

</body>
</html>
