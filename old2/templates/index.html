
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handwritten Recognition Upload</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center vh-100">
  <div class="text-center">
    <h1 class="mb-4">Upload Handwritten Script</h1>
    <form method="POST" action="/upload" enctype="multipart/form-data" class="border p-4 bg-white rounded shadow" style="min-width: 300px;">
      <input class="form-control mb-3" type="file" name="file" required>
      <button class="btn btn-primary w-100" type="submit">Upload and Download PDF</button>
    </form>
  </div>
</body>
</html>
