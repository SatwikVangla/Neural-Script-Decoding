<!doctype html>
<html lang="en">
<head>
    <title>Result</title>
</head>
<body>
    <h1>Recognition Result</h1>
    <h2>Uploaded Image</h2>
    <img src="{{ url_for('static', filename=image_path.split('static/')[1]) }}" width="400"/>

    <h2>Raw OCR Text</h2>
    <pre>{{ raw_text }}</pre>

    <h2>Corrected Text (LLM)</h2>
    <pre>{{ corrected_text }}</pre>

    <a href="{{ url_for('download_pdf', filename=pdf_path.split('/')[-1]) }}">
        <button>Download Corrected Text as PDF</button>
    </a>
</body>
</html>
