services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - app_uploads:/app/static/uploads
      - app_instance:/app/instance
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - /app/scripts/ollama_healthcheck.py
        - http://127.0.0.1:5000/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  app_uploads:
  app_instance:
  ollama_data:
